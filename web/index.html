  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #F8F5EC; overscroll-behavior: none; }
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    ::selection { background: transparent; }
    #splash { position: fixed; inset: 0; background: #F8F5EC; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity .35s ease-out; }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    #splash svg { width: 84px; height: 84px; filter: blur(8px); opacity: 0; animation: arrive .9s .1s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes arrive { to { filter: blur(0); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; filter: none; opacity: 1; } }
    #safe-area-probe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body>
  <div id="safe-area-probe"></div>
  <div id="splash">
    <svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="224" fill="#fff"/><g transform="translate(0 60)"><g fill="#1e2536"><rect x="212" y="600" width="168" height="224" rx="34"/><rect x="428" y="468" width="168" height="356" rx="34"/><rect x="644" y="336" width="168" height="488" rx="34"/></g><g fill="none" stroke="#14683c" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"><path d="M212 452L430 270L560 332L792 128"/><path d="M668 118H800V250"/></g></g><rect x="3" y="3" width="1018" height="1018" rx="221" fill="none" stroke="#16170f" stroke-opacity=".08" stroke-width="6"/></svg>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // Look for a newer version every time the app opens, not only when the browser decides to.
          reg.update().catch(() => {});
          // Installed PWAs on iOS resume instead of reloading: look for a new version on return.
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch((e) => console.warn('Service worker registration failed:', e));
      });
      // A new version has taken over: reload into it, but never while the app is on
      // screen. A reload starts at the lock screen, so doing it while you look at
      // the app would ask for the PIN or passkey a second time. So it waits until
      // the app is in the background. Not on the very first install, when there was
      // no older version to replace.
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      const reloadWhenHidden = () => {
        if (document.visibilityState === 'hidden') return window.location.reload();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') window.location.reload();
        });
      };
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        // First install on a browser without WasmGC: it runs main.dart.js on CanvasKit,
        // which the worker does not precache. Fetch them once through it so they work offline.
        if (!hadController && !WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]))) {
          ['main.dart.js', 'canvaskit/canvaskit.js', 'canvaskit/canvaskit.wasm'].forEach((u) => fetch(u).catch(() => {}));
        }
        if (!hadController || reloading) return;
        reloading = true;
        reloadWhenHidden();
      });
    }
    // The Markdown export: the share sheet where there is one (iPhone: Save to Files,
    // AirDrop, mail), else a plain download.
    window.futureSaveFile = function (name, text) {
      const file = new File([text], name, { type: 'text/markdown' });
      const download = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(file);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      };
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch((e) => { if (e.name !== 'AbortError') download(); });
      } else {
        download();
      }
    };
    // Pull to refresh also looks for a newer version of the app itself.
    window.futureCheckUpdate = function () {
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
    };
    let splashHidden = false;
    window.futureHideSplash = function () {
      if (splashHidden) return;
      splashHidden = true;
      const splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(() => splash.remove(), 450);
    };
    // The page stops under the status bar (no viewport-fit=cover: with it, touches on an iPhone home screen
    // app landed off target), so CSS reports no insets. As a home screen app on a Face ID iPhone the page
    // still reaches the bottom edge, where the home indicator takes 34 pt.
    window.futureSafeArea = function () {
      const probe = document.getElementById('safe-area-probe');
      const s = probe ? getComputedStyle(probe) : null;
      const px = (v) => (s ? parseFloat(v) || 0 : 0);
      let bottom = s ? px(s.paddingBottom) : 0;
      const homeIndicator = navigator.standalone === true && /iPhone/.test(navigator.userAgent) && Math.max(screen.width, screen.height) >= 812;
      if (homeIndicator) bottom = Math.max(bottom, 34);
      return [s ? px(s.paddingTop) : 0, s ? px(s.paddingRight) : 0, bottom, s ? px(s.paddingLeft) : 0].join(',');
    };
    setTimeout(window.futureHideSplash, 15000);
  </script>
  <script src="haptics.js"></script>
  <script src="biometrics.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
