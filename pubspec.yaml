name: the_future
description: "Your Bitpanda portfolio and what it becomes."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  http: ^1.2.2
  intl: any
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  liquid_glass_widgets: ^1.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
